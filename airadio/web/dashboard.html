<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Rádió – Stúdió</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0b0d12; --panel: #12151c; --panel2: #171b24; --line: #232a36; --line2: #2e3646;
  --text: #e7eaf0; --muted: #8e97aa; --dim: #5f687a;
  --accent: #4f8cff; --accent-ink: #fff;
  --onair: #ff4545; --ok: #2fd27a; --warn: #ffb020; --manual: #b48cff;
  --radius: 12px; --hdr: 90px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.small { font-size: 12px; }

/* --- elrendezés --- */
.app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
header.top { grid-column: 1 / -1; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
  height: var(--hdr); padding: 10px 18px; background: rgba(11,13,18,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.side { border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: var(--hdr); height: calc(100vh - var(--hdr)); overflow: auto; }
main { padding: 20px 24px 120px; width: 100%; min-width: 0; }
nav.side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--muted);
  text-decoration: none; font-weight: 500; }
nav.side a:hover { background: var(--panel2); color: var(--text); }
nav.side a.active { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
nav.side .ic { opacity: .85; }
nav.side a.active .ic { opacity: 1; color: var(--accent); }
nav.side .sep { height: 1px; background: var(--line); margin: 10px 6px; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; min-width: 190px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #c084fc); display: grid; place-items: center; color: #fff; }
.brand .logo .ic { width: 17px; height: 17px; stroke-width: 2; }
.onair { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; font-weight: 800;
  letter-spacing: .08em; font-size: 12px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.onair .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.onair.live { color: #fff; background: var(--onair); border-color: var(--onair); }
.onair.live .lamp { background: #fff; animation: pulse 1.2s infinite; }
.onair.news { color: #1a1300; background: var(--warn); border-color: var(--warn); }
.onair.news .lamp { background: #1a1300; }
.onair.auto { color: var(--ok); border-color: rgba(47,210,122,.45); } .onair.auto .lamp { background: var(--ok); }
.onair.manual { color: var(--manual); border-color: rgba(180,140,255,.5); } .onair.manual .lamp { background: var(--manual); }
.onair.down { color: var(--onair); border-color: rgba(255,69,69,.5); } .onair.down .lamp { background: var(--onair); }
@keyframes pulse { 50% { opacity: .35; } }
.np { flex: 1; min-width: 0; }
.np .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat { text-align: right; white-space: nowrap; }
.stat .v { font-weight: 700; } .stat .l { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.clock { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: .02em; }
.monitor { display: flex; align-items: center; gap: 14px; padding-left: 18px; border-left: 1px solid var(--line); }
.mini { width: 190px; height: 52px; display: block; }
.monitor input[type=range] { width: 96px; accent-color: #6d7cff; }

/* a legfontosabb gomb: monitor lejátszás */
.bigplay { position: relative; flex: none; width: 68px; height: 68px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #c084fc);
  box-shadow: 0 8px 28px rgba(99,102,241,.55), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .15s, box-shadow .15s; }
.bigplay:hover { transform: scale(1.06); box-shadow: 0 10px 38px rgba(99,102,241,.8), inset 0 1px 0 rgba(255,255,255,.35); }
.bigplay:active { transform: scale(.96); }
.bigplay .ic { width: 32px; height: 32px; stroke-width: 2.4; }
.bigplay.on::before, .bigplay.on::after, .stage-play .disc::before { content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid rgba(129,140,248,.75); animation: ring 2s ease-out infinite; pointer-events: none; }
.bigplay.on::after { animation-delay: 1s; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.32); opacity: 0; } }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
.ic .fill { fill: currentColor; stroke: none; }
.ic.sm { width: 15px; height: 15px; } .ic.xs { width: 12px; height: 12px; } .ic.lg { width: 22px; height: 22px; }
.spinning { animation: rot .9s linear infinite; }

/* színpad: a zenére pulzáló spektrum */
.stage { position: relative; height: 400px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(900px 260px at 20% -20%, rgba(99,102,241,.16), transparent), linear-gradient(180deg, #10131a, #0b0d12); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(11,13,18,.82) 0%, rgba(11,13,18,.35) 38%, rgba(11,13,18,0) 60%); }
.stage-ui { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 20px 22px; pointer-events: none; }
.stage-ui > * { pointer-events: auto; }
.stage-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
.stage .src { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.stage .title { font-size: 30px; font-weight: 760; line-height: 1.15; margin: 6px 0 4px; overflow-wrap: anywhere; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
.stage .meta { color: var(--muted); }
.stage .actions { display: grid; gap: 8px; min-width: 220px; }
.stage-tools { margin-top: auto; display: flex; justify-content: flex-end; gap: 8px; }
.seg { display: inline-flex; background: rgba(11,13,18,.6); border: 1px solid var(--line2); border-radius: 9px; padding: 3px; backdrop-filter: blur(6px); }
.seg button { background: none; border: 0; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.seg button.on { background: var(--panel2); color: var(--text); }
.glass { background: rgba(11,13,18,.6); backdrop-filter: blur(6px); }
.stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .14em;
  text-transform: uppercase; transition: opacity .25s; }
.stage-play .disc { position: relative; width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #c084fc); transition: transform .18s, box-shadow .18s;
  box-shadow: 0 20px 70px rgba(99,102,241,.6), 0 0 0 12px rgba(99,102,241,.14), inset 0 2px 0 rgba(255,255,255,.35); }
.stage-play .disc::before { inset: -14px; }
.stage-play .disc .ic { width: 76px; height: 76px; stroke-width: 2.2; }
.stage-play:hover .disc { transform: scale(1.06); box-shadow: 0 24px 90px rgba(99,102,241,.85), 0 0 0 16px rgba(99,102,241,.2), inset 0 2px 0 rgba(255,255,255,.35); }
.stage-play:active .disc { transform: scale(.96); }
.stage-play .cap { white-space: nowrap; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
.stage:not(.playing) #ovHeroText { max-width: calc(50% - 110px); }
.stage.playing .stage-play { opacity: 0; }
.stage.playing:hover .stage-play, .stage.playing .stage-play:focus-visible { opacity: 1; }
.stage.playing .stage-play .disc { width: 128px; height: 128px; background: rgba(11,13,18,.5); border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(8px); box-shadow: 0 16px 50px rgba(0,0,0,.45); }
.stage.playing .stage-play .disc::before { display: none; }
.stage.playing .stage-play .disc .ic { width: 56px; height: 56px; }
@media (hover: none) { .stage.playing .stage-play { opacity: .75; } }
.stage:fullscreen { height: 100vh; border-radius: 0; border: 0; }
.stage:fullscreen .stage-ui { padding: 48px 56px; }
.stage:fullscreen .title { font-size: clamp(36px, 5vw, 72px); }
.stage:fullscreen .actions { display: none; }

/* --- elemek --- */
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi .v { font-size: 26px; font-weight: 700; } .kpi .l { color: var(--muted); font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line2);
  background: var(--panel2); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.amber { background: var(--warn); border-color: var(--warn); color: #1a1300; }
.btn.danger { color: var(--onair); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.btn.icon { padding: 6px 9px; }
.btn.round { width: 34px; height: 34px; padding: 0; border-radius: 50%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
label.f { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 600; }
input[type=text], input[type=url], input[type=number], input[type=password], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; color: var(--text); }
textarea { resize: vertical; min-height: 64px; }
input[type=range] { accent-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line2); position: relative; cursor: pointer; transition: .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked { background: var(--accent); } .switch input:checked::after { left: 17px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--dim); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--onair); } .dot.warn { background: var(--warn); } .dot.manual { background: var(--manual); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); }
.badge.ok { color: var(--ok); border-color: rgba(47,210,122,.4); } .badge.bad { color: var(--onair); border-color: rgba(255,69,69,.4); }
.badge.warn { color: var(--warn); border-color: rgba(255,176,32,.4); } .badge.manual { color: var(--manual); border-color: rgba(180,140,255,.4); }
.list { display: grid; gap: 6px; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel2); min-width: 0; }
.item.playing { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.item.manual { border-color: var(--manual); box-shadow: inset 3px 0 0 var(--manual); }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .url { color: var(--dim); font-size: 11px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--dim); padding: 14px; text-align: center; border: 1px dashed var(--line2); border-radius: 9px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 14px; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: rgba(255,255,255,.015); }

/* idővonal */
.timeline { position: relative; height: 54px; margin-top: 4px; }
.timeline .bar { position: absolute; top: 14px; height: 22px; border-radius: 5px; font-size: 11px; font-weight: 700; padding: 3px 6px; overflow: hidden; white-space: nowrap; color: #0b0d12; }
.timeline .tick { position: absolute; top: 8px; width: 2px; height: 6px; background: var(--warn); border-radius: 1px; }
.timeline .now { position: absolute; top: 4px; bottom: 6px; width: 2px; background: var(--onair); box-shadow: 0 0 0 3px rgba(255,69,69,.18); }
.timeline .scale { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; font-family: var(--mono); }
.dp0 { background: #ffb020; } .dp1 { background: #4f8cff; } .dp2 { background: #b48cff; } .dp3 { background: #2fd27a; } .dp4 { background: #ff7a59; } .dp5 { background: #3dd6d0; }

/* óra-rács */
.hours { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
.hours button { padding: 7px 0; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg); color: var(--dim); font-family: var(--mono); cursor: pointer; }
.hours button.on { background: rgba(255,176,32,.14); border-color: var(--warn); color: var(--warn); font-weight: 700; }

/* hero */

/* napló */
.log { background: #07090c; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; height: 62vh; overflow: auto;
  font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.log .e { color: var(--onair); } .log .w { color: var(--warn); } .log .i { color: var(--ok); }

/* feltöltés */
.drop { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--accent); color: var(--text); background: rgba(79,140,255,.06); }

/* mentősáv, feladatok, értesítések */
.savebar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; display: none; align-items: center; gap: 12px;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.savebar.show { display: flex; }
.jobs { position: fixed; right: 18px; bottom: 18px; z-index: 45; width: min(460px, calc(100vw - 36px)); display: grid; gap: 8px; }
.job { background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); overflow: hidden; }
.job .hd { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.job pre { margin: 0; max-height: 220px; overflow: auto; padding: 10px 12px; background: #07090c; font: 12px/1.5 var(--mono); white-space: pre-wrap; border-top: 1px solid var(--line); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.toasts { position: fixed; top: 70px; right: 18px; z-index: 60; display: grid; gap: 8px; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 9px; padding: 10px 14px; max-width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.toast.err { border-left-color: var(--onair); } .toast.ok { border-left-color: var(--ok); }
.secret { display: flex; gap: 6px; } .secret input { font-family: var(--mono); }
details.b { border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
details.b summary { cursor: pointer; padding: 10px 12px; list-style: none; display: flex; gap: 10px; align-items: center; }
details.b summary::-webkit-details-marker { display: none; }
details.b .body { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
details.b .body p { margin: 10px 0 0; }
.note { padding: 10px 12px; border-radius: 9px; background: rgba(79,140,255,.08); border: 1px solid rgba(79,140,255,.25); color: var(--text); }
.note.warn { background: rgba(255,176,32,.08); border-color: rgba(255,176,32,.3); }


/* --- stúdió --- */
.studio-top { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
.clockcard { display: flex; flex-direction: column; gap: 14px; }
.bigclock { font-size: 54px; font-weight: 650; letter-spacing: .02em; line-height: 1; }
.bigclock .sec { color: var(--muted); font-size: 30px; }
.cd .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.cdv { font-size: 30px; font-weight: 650; margin-top: 2px; color: var(--warn); }
.cdbar { height: 4px; border-radius: 2px; background: var(--line2); margin-top: 8px; overflow: hidden; }
.cdbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--warn), #f97316); transition: width .5s linear; }
.lamps { display: grid; gap: 8px; margin-top: auto; }
.lampi { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.lampi .v { margin-left: auto; color: var(--muted); font-size: 12px; }
.led { width: 10px; height: 10px; border-radius: 50%; background: #2a303c; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); flex: none; }
.led.ok { background: var(--ok); box-shadow: 0 0 10px rgba(47,210,122,.7); }
.led.bad { background: var(--onair); box-shadow: 0 0 10px rgba(255,69,69,.7); }
.led.warn { background: var(--warn); box-shadow: 0 0 10px rgba(255,176,32,.6); }

.desk { border-radius: 16px; border: 1px solid var(--line2); overflow: hidden;
  background: linear-gradient(180deg, #1a1f29 0%, #12161e 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 50px rgba(0,0,0,.35); }
.desk-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #0b0d12;
  background: linear-gradient(180deg, #1f2531, #191e28); }
.desk-title { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
.desk-body { display: flex; overflow-x: auto; }
.strip { flex: 1 0 128px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 10px 16px;
  border-right: 1px solid #0b0d12; box-shadow: inset -1px 0 0 rgba(255,255,255,.03); }
.strip:last-child { border-right: 0; }
.strip-head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text); }
.lamp { width: 9px; height: 9px; border-radius: 50%; background: #2a303c; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
.lamp.on { background: var(--onair); box-shadow: 0 0 12px rgba(255,69,69,.9); }
.lamp.on.green { background: var(--ok); box-shadow: 0 0 12px rgba(47,210,122,.8); }
.strip-knobs { min-height: 92px; display: flex; gap: 10px; justify-content: center; }
.strip-body { display: flex; gap: 10px; align-items: stretch; height: 230px; }
.strip-foot { display: flex; align-items: center; gap: 10px; }
.db { min-width: 54px; text-align: center; font-size: 12px; padding: 4px 6px; border-radius: 6px; background: #0b0d12; color: #9fe3b8; border: 1px solid #222935; }
.mute { width: 34px; height: 28px; border-radius: 6px; border: 1px solid #2c3442; background: linear-gradient(180deg, #252b37, #1b2029); color: var(--muted);
  font: 800 12px/1 var(--mono); cursor: pointer; }
.mute.on { background: linear-gradient(180deg, #ff5a5a, #d92f2f); color: #fff; border-color: #ff6b6b; box-shadow: 0 0 14px rgba(255,69,69,.55); }
.strip.master { flex: 2.4 0 380px; background: linear-gradient(180deg, rgba(99,102,241,.06), transparent); }
.master-row { display: flex; gap: 18px; align-items: flex-end; flex: 1; }
.master-knobs { align-self: flex-start; }
.master-knobs { display: grid; grid-template-columns: repeat(3, auto); gap: 10px 8px; }
.master-side { display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* fader */
.fader { position: relative; width: 58px; height: 100%; cursor: ns-resize; touch-action: none; outline: none; }
.fader .scale { position: absolute; left: 0; top: 11px; bottom: 11px; width: 22px; }
.fader .scale span { position: absolute; right: 0; transform: translateY(50%); font: 9px/1 var(--mono); color: var(--dim); white-space: nowrap; }
.fader .scale span::after { content: ""; display: inline-block; width: 4px; height: 1px; background: var(--dim); margin-left: 3px; vertical-align: middle; }
.fader .groove { position: absolute; left: 36px; top: 11px; bottom: 11px; width: 6px; border-radius: 3px; background: #07090c;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05); overflow: hidden; }
.fader .groove i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #4f8cff, #a855f7); opacity: .55; }
.fader .cap { position: absolute; left: 25px; width: 28px; height: 22px; border-radius: 5px; transform: translateY(50%);
  background: linear-gradient(180deg, #f1f4f9 0%, #c9d0dc 45%, #9aa3b5 55%, #dfe4ec 100%);
  box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.8); }
.fader .cap::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; margin-top: -1px; background: #22272f; border-radius: 1px; }
.fader:focus-visible .cap { outline: 2px solid var(--accent); outline-offset: 2px; }

/* LED-mérő */
.meter { width: 14px; height: 100%; display: block; }
.meter.wide { width: 30px; }

/* forgatógomb */
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: ns-resize; touch-action: none; outline: none; user-select: none; }
.knob svg { width: 54px; height: 54px; overflow: visible; }
.knob .track { fill: none; stroke: #0b0d12; stroke-width: 5; stroke-linecap: round; }
.knob .val { fill: none; stroke: url(#knobgrad); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(99,102,241,.6)); }
.knob .cap { fill: url(#capgrad); stroke: #0b0d12; stroke-width: 1; }
.knob .ptr { stroke: #e7eaf0; stroke-width: 2.4; stroke-linecap: round; }
.knob .kv { font-size: 10.5px; color: #9fe3b8; }
.knob .kl { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.knob:focus-visible svg { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 50%; }

/* padok */
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pad { position: relative; text-align: left; min-height: 74px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line2); cursor: pointer;
  background: linear-gradient(180deg, #1c212c, #151922); color: var(--text); display: flex; flex-direction: column; gap: 6px; transition: transform .08s, box-shadow .15s; }
.pad:hover { border-color: var(--dim); }
.pad:active { transform: scale(.98); }
.pad .pn { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pad .ps { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.pad.onair { border-color: rgba(47,210,122,.7); box-shadow: 0 0 0 1px rgba(47,210,122,.5), 0 0 24px rgba(47,210,122,.18); background: linear-gradient(180deg, rgba(47,210,122,.14), #151922); }
.pad.manual { border-color: rgba(180,140,255,.7); box-shadow: 0 0 0 1px rgba(180,140,255,.5), 0 0 24px rgba(180,140,255,.2); background: linear-gradient(180deg, rgba(180,140,255,.16), #151922); }
.pad.cart { background: linear-gradient(180deg, #232036, #171522); }
.pad.cart.playing { border-color: var(--warn); box-shadow: 0 0 0 1px rgba(255,176,32,.5), 0 0 24px rgba(255,176,32,.25); }
.pad:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 1100px) { .studio-top { grid-template-columns: 1fr; } }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } .stat.hide-md { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
  nav.side .sep { display: none; }
  main { padding: 16px 16px 120px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; } .span2 { grid-column: auto; }
  header.top { flex-wrap: wrap; gap: 10px; height: auto; } .np { order: 9; flex-basis: 100%; }
  .bigplay { width: 60px; height: 60px; } .monitor input[type=range] { width: 80px; }
  .stat.hide-sm, .monitor .mini { display: none; }
  .stage { height: 580px; } .stage-top { flex-direction: column; } .stage:not(.playing) #ovHeroText { max-width: none; }
  .stage-play { top: 62%; } .stage-play .disc { width: 132px; height: 132px; } .stage-play .disc .ic { width: 60px; height: 60px; } .stage .actions { min-width: 0; width: 100%; } .stage .title { font-size: 24px; }
}
</style>
</head>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (iso) => { if (!iso) return "–"; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}.${pad(d.getDate())}. ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtBytes = (b) => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " kB";
const usd = (v) => "$" + (v ?? 0).toFixed(v >= 1 ? 2 : 3);
const ic = (name, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const S = { status: null, cfg: null, saved: null, dirty: false, page: "attekintes", dpTab: 0, logSrc: "radio", logAuto: true, voices: [], seq: 0, skew: 0 };
// Lassabb oldal ne írja felül a közben megnyitott másikat.
const stale = (t) => t !== S.seq;
// A szerver (rádió) ideje: a műsorrend és az óra ehhez igazodik, nem a böngészőhöz.
const serverNow = () => new Date(Date.now() + S.skew);

async function api(method, path, body, raw) {
  const opt = { method, headers: {} };
  if (body !== undefined && !raw) { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  if (raw) opt.body = body;
  const res = await fetch(path, opt);
  const ctype = res.headers.get("Content-Type") || "";
  const data = ctype.includes("json") ? await res.json() : await res.blob();
  if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").append(el); setTimeout(() => el.remove(), kind === "err" ? 7000 : 3500);
}
const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------------- állapot és fejléc ---------------- */
const SRC = {
  elo: ["ÉLŐ ADÁS", "live"], hirek: ["HÍREK", "news"], kezi: ["KÉZI", "manual"],
  allomas: ["AUTO", "auto"], tartalek: ["TARTALÉK", "auto"], csend: ["CSEND", "down"],
};
function onAirInfo(st) {
  const r = st && st.radio;
  if (!r || r.stale) return { label: "NEM FUT", cls: "down", src: "csend" };
  const [label, cls] = SRC[r.on_air] || ["AUTO", "auto"];
  return { label, cls, src: r.on_air };
}
function nowTitle(st) {
  const r = st.radio || {};
  if (r.on_air === "hirek") return "Hírek";
  const parts = [r.artist, r.title].filter(Boolean);
  if (parts.length) return parts.join(" – ");
  return st.icecast && st.icecast.title || "";
}
function renderHeader() {
  const st = S.status; if (!st) return;
  $("#hName").textContent = st.name || "AI Rádió";
  const oa = onAirInfo(st);
  const el = $("#hOnair"); el.className = "onair " + oa.cls; el.lastElementChild.textContent = oa.label;
  const r = st.radio || {};
  const t = nowTitle(st);
  $("#hTitle").textContent = t || (oa.src === "tartalek" ? "Tartalék zene" : r.station || "–");
  $("#hSub").textContent = r.station ? `${t ? r.station + " · " : ""}${r.daypart || ""}` : (st.icecast.up ? "" : "Az Icecast nem válaszol");
  const n = st.news.next;
  $("#hNext").innerHTML = n ? `${fmtTime(n.slot)}${n.ready ? " " + ic("check", "xs") : ""}` : "nincs";
  const pal = { live: "live", news: "news", manual: "manual", auto: "auto", down: "idle" }[oa.cls] || "auto";
  [miniViz, stageViz].forEach((v) => v && v.setPalette(pal));
  $("#hListeners").textContent = st.icecast.on_air ? st.icecast.listeners : "–";
}
setInterval(() => { const d = serverNow(); $("#hClock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }, 250);

async function pollStatus() {
  try { S.status = await api("GET", "/api/status"); S.skew = new Date(S.status.now) - Date.now(); renderHeader(); if (S.page === "attekintes") renderOverviewLive(); if (S.page === "elo") renderLiveState(); }
  catch (e) { S.status = null; const el = $("#hOnair"); el.className = "onair down"; el.lastElementChild.textContent = "NINCS KAPCSOLAT"; }
  setTimeout(pollStatus, 2000);
}

/* ---------------- monitor + VU ---------------- */
const mon = $("#monitor"); let actx, analyser, stageViz = null;
const miniViz = new AiradioSpectrum($("#miniViz"), { bars: 22, reflection: false, peaks: false, glow: 8, bloom: false });
miniViz.start();
const MON_CAP = { play: "Monitor bekapcsolása", pause: "Monitor leállítása", loader: "Kapcsolódás" };
let monIcon = "play";
function paintStagePlay() {
  const b = $("#stagePlay"); if (!b) return;
  b.innerHTML = `<span class="disc">${ic(monIcon, monIcon === "loader" ? "spinning" : "")}</span><span class="cap">${MON_CAP[monIcon]}</span>`;
  b.setAttribute("aria-label", MON_CAP[monIcon]);
}
const setMonBtn = (icon, label) => {
  monIcon = icon;
  $("#monBtn").innerHTML = ic(icon, icon === "loader" ? "spinning" : ""); $("#monBtn").setAttribute("aria-label", label);
  $("#monBtn").classList.toggle("on", icon === "pause");
  paintStagePlay();
};

const jobViews = new Map();
async function startJob(path, onDone) {
  try { const job = await api("POST", path); trackJob(job.id, onDone); }
  catch (e) { toast(e.message, "err"); }
}
function trackJob(id, onDone) {
  if (jobViews.has(id)) return;
  const el = document.createElement("div"); el.className = "job";
  el.innerHTML = `<div class="hd"><span class="spin"></span><b class="grow" style="flex:1"></b><button class="btn icon sm ghost" aria-label="Bezár">${ic("x", "sm")}</button></div><pre></pre>`;
  el.querySelector("button").onclick = () => { el.remove(); jobViews.delete(id); };
  $("#jobs").append(el); jobViews.set(id, el);
  const tick = async () => {
    let job; try { job = await api("GET", "/api/jobs/" + id); } catch { return setTimeout(tick, 1500); }
    el.querySelector("b").textContent = job.title + (job.status === "fut" ? "…" : job.status === "kész" ? " – kész" : " – hiba");
    const pre = el.querySelector("pre"); pre.textContent = job.lines.join("\n") || "…"; pre.scrollTop = pre.scrollHeight;
    if (job.status === "fut") return setTimeout(tick, 1000);
    el.querySelector(".spin").replaceWith(Object.assign(document.createElement("span"), { className: "dot " + (job.status === "kész" ? "ok" : "bad") }));
    if (onDone) onDone(job);
    if (job.status === "kész") setTimeout(() => { if (jobViews.get(id) === el) { el.remove(); jobViews.delete(id); } }, 20000);
  };
  tick();
}

  dayparts.forEach((d, i) => {
    const pieces = d.start <= d.stop ? [[d.start, d.stop]] : [[d.start, 24], [0, d.stop]];
    for (const [a, b] of pieces) if (b > a) segs.push(`<div class="bar ${dpColor(i)}" style="left:${a / 24 * 100}%;width:calc(${(b - a) / 24 * 100}% - 3px)" title="${esc(d.name)} ${a}–${b}">${esc(d.name)}</div>`);
  });
  const ticks = (hours || []).map((h) => `<div class="tick" style="left:calc(${h / 24 * 100}% - 1px)" title="Hírek ${h}:00"></div>`).join("");
  const d = serverNow(), pos = (d.getHours() + d.getMinutes() / 60) / 24 * 100;
  return `<div class="timeline">${segs.join("")}${ticks}<div class="now" style="left:${pos}%"></div>
    <div class="scale"><span>0</span><span>3</span><span>6</span><span>9</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div></div>`;
}

/* Stúdió: színpad, adásóra, keverőpult, állomás-deck, effekt-kártyák */
const FADER_TOP = 12, FADER_MIN = -60;
const posToDb = (p) => p >= 0.75 ? (p - 0.75) / 0.25 * FADER_TOP : p <= 0.001 ? FADER_MIN : FADER_MIN * Math.pow(1 - p / 0.75, 1.6);
const dbToPos = (db) => db >= 0 ? 0.75 + db / FADER_TOP * 0.25 : db <= FADER_MIN ? 0 : 0.75 * (1 - Math.pow(db / FADER_MIN, 1 / 1.6));
const fmtGain = (db) => db <= FADER_MIN + 0.05 ? "ki" : `${db > 0 ? "+" : ""}${db.toFixed(1)}`;
const KFMT = {
  db: (v) => `${v > 0 ? "+" : ""}${v.toFixed(1)} dB`,
  bed: (v) => v <= -59.5 ? "ki" : `${v.toFixed(0)} dB`,
  pct: (v) => `${Math.round(v * 100)}%`,
  sec: (v) => `${v.toFixed(1)} mp`,
};
const MIX_DEFAULT = { music: { gain: 0, mute: false }, news: { gain: 0, mute: false }, live: { gain: 0, mute: false }, cart: { gain: 0, mute: false },
  master: { gain: 0, mute: false }, news_bed: -60, live_bed: -60, eq: { low: 0, mid: 0, high: 0 }, comp: 0, limiter: true, xfade: 1 };
let mixState = null, mixSaving = false, mixDirty = false, levelData = null, levelTimer = null, meterRaf = null, lastCart = null;
const meterState = {};

const getPath = (o, path) => path.split(".").reduce((a, k) => a[k], o);
const setPath = (o, path, v) => { const ks = path.split("."), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
function saveMix() {
  if (mixSaving) { mixDirty = true; return; }
  mixSaving = true;
  api("PUT", "/api/mixer", mixState).catch((e) => toast(e.message, "err"))
    .finally(() => { mixSaving = false; if (mixDirty) { mixDirty = false; saveMix(); } });
}
const saveMixSoon = (() => { let t; return () => { clearTimeout(t); t = setTimeout(saveMix, 50); }; })();

function arcPath(r, a0, a1) {
  const pt = (a) => [32 + r * Math.sin(a * Math.PI / 180), 32 - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function knobHTML(path, label, min, max, def, fmt) {
  return `<div class="knob" data-knob="${path}" data-min="${min}" data-max="${max}" data-def="${def}" data-fmt="${fmt}" role="slider" tabindex="0"
      aria-label="${label}" aria-valuemin="${min}" aria-valuemax="${max}" title="Húzd fel-le; dupla katt: alapérték">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path class="track" d="${arcPath(26, -135, 135)}"/><path class="val"/><circle class="cap" cx="32" cy="32" r="17"/><line class="ptr" x1="32" y1="32" x2="32" y2="20"/></svg>
    <div class="kv mono"></div><div class="kl">${label}</div></div>`;
}
function faderHTML(path, label) {
  const ticks = [12, 6, 0, -6, -12, -20, -30, -45].map((db) => `<span style="bottom:${dbToPos(db) * 100}%">${db > 0 ? "+" + db : db}</span>`).join("");
  return `<div class="fader" data-fader="${path}" role="slider" tabindex="0" aria-label="${label}" aria-valuemin="-60" aria-valuemax="12" title="Húzd; dupla katt: 0 dB">
    <div class="scale">${ticks}</div><div class="groove"><i></i></div><div class="cap"></div></div>`;
}
function stripHTML(ch, label, knobs = "") {
  return `<div class="strip" data-ch="${ch}">
    <div class="strip-head"><span class="lamp" data-lamp="${ch}"></span>${label}</div>
    <div class="strip-knobs">${knobs}</div>

    <div class="strip-foot"><span class="db mono" data-db="${ch}.gain"></span><button class="mute" data-mute="${ch}" aria-pressed="false" title="Némítás">M</button></div>

}
function deskHTML() {

      <linearGradient id="knobgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
      <radialGradient id="capgrad" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#191d26"/></radialGradient>

            ${knobHTML("comp", "Kompr.", 0, 1, 0, "pct")}${knobHTML("xfade", "Átúszt.", 0, 8, 1, "sec")}
            <div class="knob" style="cursor:default"><label class="switch" style="margin-top:14px"><input type="checkbox" id="limiter"></label><div class="kv mono" id="limTxt"></div><div class="kl">Limiter</div></div>

            <div class="strip-foot"><span class="db mono" data-db="master.gain"></span><button class="mute" data-mute="master" aria-pressed="false" title="Némítás">M</button></div>
          </div>

function paintDesk() {
  const desk = $("#desk"); if (!desk || !mixState) return;
  desk.querySelectorAll("[data-fader]").forEach((f) => {
    const db = getPath(mixState, f.dataset.fader), pos = dbToPos(db);
    f.querySelector(".cap").style.bottom = `calc(${pos} * (100% - 22px))`;
    f.querySelector(".groove i").style.height = `${pos * 100}%`;
    f.setAttribute("aria-valuenow", db.toFixed(1));
    f.setAttribute("aria-valuetext", fmtGain(db) + " dB");
  });
  desk.querySelectorAll("[data-db]").forEach((d) => d.textContent = fmtGain(getPath(mixState, d.dataset.db)));
  desk.querySelectorAll("[data-knob]").forEach((k) => {
    const v = getPath(mixState, k.dataset.knob), min = +k.dataset.min, max = +k.dataset.max;
    const ang = -135 + (v - min) / (max - min) * 270;
    const from = min < 0 && max > 0 ? 0 : -135;
    k.querySelector(".val").setAttribute("d", Math.abs(ang - from) < 0.5 ? "" : arcPath(26, Math.min(from, ang), Math.max(from, ang)));
    k.querySelector(".ptr").setAttribute("transform", `rotate(${ang} 32 32)`);
    k.querySelector(".kv").textContent = KFMT[k.dataset.fmt](v);
    k.setAttribute("aria-valuenow", v);
    k.setAttribute("aria-valuetext", KFMT[k.dataset.fmt](v));
  });
  desk.querySelectorAll("[data-mute]").forEach((b) => { const on = mixState[b.dataset.mute].mute; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  $("#limiter").checked = mixState.limiter;
  $("#limTxt").textContent = mixState.limiter ? "be" : "ki";
}

function bindDesk() {
  const desk = $("#desk");
  const change = (path, v) => { setPath(mixState, path, v); paintDesk(); saveMixSoon(); };
  desk.querySelectorAll("[data-fader]").forEach((f) => {
    const path = f.dataset.fader;
    const fromY = (y) => { const r = f.querySelector(".groove").getBoundingClientRect(); return Math.max(0, Math.min(1, 1 - (y - r.top) / r.height)); };
    f.onpointerdown = (e) => { f.setPointerCapture(e.pointerId); f.focus(); change(path, Math.round(posToDb(fromY(e.clientY)) * 2) / 2); };
    f.onpointermove = (e) => { if (f.hasPointerCapture(e.pointerId)) change(path, Math.round(posToDb(fromY(e.clientY)) * 2) / 2); };
    f.ondblclick = () => change(path, 0);
    f.onwheel = (e) => { e.preventDefault(); const db = getPath(mixState, path); change(path, Math.max(FADER_MIN, Math.min(FADER_TOP, db - Math.sign(e.deltaY) * 0.5))); };
    f.onkeydown = (e) => {
      const step = { ArrowUp: 0.5, ArrowDown: -0.5, PageUp: 3, PageDown: -3 }[e.key];
      if (step) { e.preventDefault(); change(path, Math.max(FADER_MIN, Math.min(FADER_TOP, getPath(mixState, path) + step))); }
      if (e.key === "Home") change(path, 0);
      if (e.key === "End") change(path, FADER_MIN);
    };
  });
  desk.querySelectorAll("[data-knob]").forEach((k) => {
    const path = k.dataset.knob, min = +k.dataset.min, max = +k.dataset.max, def = +k.dataset.def;
    const clamp = (v) => Math.max(min, Math.min(max, v));
    const round = (v) => max - min > 2 ? Math.round(v * 2) / 2 : Math.round(v * 100) / 100;
    let y0 = 0, v0 = 0;
    k.onpointerdown = (e) => { k.setPointerCapture(e.pointerId); k.focus(); y0 = e.clientY; v0 = getPath(mixState, path); };
    k.onpointermove = (e) => { if (k.hasPointerCapture(e.pointerId)) change(path, round(clamp(v0 + (y0 - e.clientY) * (max - min) / 180))); };
    k.ondblclick = () => change(path, def);
    k.onwheel = (e) => { e.preventDefault(); change(path, round(clamp(getPath(mixState, path) - Math.sign(e.deltaY) * (max - min) / 48))); };
    k.onkeydown = (e) => {
      const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (step) { e.preventDefault(); change(path, round(clamp(getPath(mixState, path) + step * (max - min) / 48))); }
    };
  });
  desk.querySelectorAll("[data-mute]").forEach((b) => b.onclick = () => change(b.dataset.mute + ".mute", !mixState[b.dataset.mute].mute));
  $("#limiter").onchange = (e) => change("limiter", e.target.checked);
  $("#mixReset").onclick = () => { if (confirm("Minden keverőpult-beállítás vissza az alapértékre?")) { mixState = JSON.parse(JSON.stringify(MIX_DEFAULT)); paintDesk(); saveMix(); } };
}

/* szintmérők: a Liquidsoap 10-szer másodpercenként adja az RMS-t */
async function pollLevels() {
  clearTimeout(levelTimer);
  if (!$("#desk")) return;
  let wait = 100;
  try { levelData = await api("GET", "/api/levels"); $("#deskState").textContent = "élő mérés"; }
  catch { levelData = null; $("#deskState").textContent = "a rádió nem válaszol"; wait = 1500; }
  paintLamps();
  levelTimer = setTimeout(pollLevels, wait);
}
function paintLamps() {
  const L = levelData || {}, onAir = { zene: "music", hirek: "news", elo: "live" }[L.on_air];
  ["music", "news", "live"].forEach((ch) => { const l = document.querySelector(`[data-lamp="${ch}"]`); if (l) l.classList.toggle("on", onAir === ch); });
  const c = document.querySelector('[data-lamp="cart"]'); if (c) c.classList.toggle("on", !!L.cart_playing);
  const m = document.querySelector('[data-lamp="master"]'); if (m) m.classList.toggle("on", !!(S.status && S.status.icecast && S.status.icecast.on_air));
  document.querySelectorAll(".pad.cart").forEach((p) => p.classList.toggle("playing", !!L.cart_playing && p.dataset.key === lastCart));
}
const toDb = (lin) => lin > 0 ? 20 * Math.log10(lin) : -120;
function drawMeters(t) {
  if (!$("#desk")) { meterRaf = null; return; }
  meterRaf = requestAnimationFrame(drawMeters);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), segs = 30, lo = -48, hi = 3;
  document.querySelectorAll("canvas[data-meter]").forEach((cv) => {
    const ch = cv.dataset.meter, st = meterState[ch] || (meterState[ch] = { v: lo, pk: lo, pkT: 0 });
    const target = levelData ? Math.max(lo, toDb(levelData[ch] || 0) + (ch === "master" ? 0 : 0)) : lo;
    st.v += (target - st.v) * (target > st.v ? 0.5 : 0.12);
    const peakIn = ch === "master" && levelData ? Math.max(lo, toDb(levelData.peak || 0)) : st.v;
    if (peakIn >= st.pk) { st.pk = peakIn; st.pkT = t + 1200; } else if (t > st.pkT) st.pk = Math.max(st.v, st.pk - 0.4);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const gap = 2, sh = (h - gap * (segs - 1)) / segs, lit = (st.v - lo) / (hi - lo) * segs, pkSeg = Math.floor((st.pk - lo) / (hi - lo) * segs);
    for (let i = 0; i < segs; i++) {
      const db = lo + (i + 0.5) / segs * (hi - lo), y = h - (i + 1) * sh - i * gap;
      const col = db >= -3 ? [255, 69, 69] : db >= -12 ? [255, 176, 32] : [47, 210, 122];
      const on = i < lit || i === pkSeg;
      ctx.fillStyle = on ? `rgb(${col})` : `rgba(${col},.09)`;
      if (on) { ctx.shadowBlur = 6; ctx.shadowColor = `rgba(${col},.8)`; } else ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, y, w, sh, 1.5) : ctx.rect(0, y, w, sh); ctx.fill();
    }
  });
}

function tickClock() {
  const box = $("#stClock"); if (!box) return;
  const d = serverNow();
  box.innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">:${pad(d.getSeconds())}</span>`;
  $("#stDate").textContent = d.toLocaleDateString("hu-HU", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const n = S.status && S.status.news.next;
  if (n) {
    const left = Math.max(0, (new Date(n.slot) - d) / 1000);
    $("#stCount").textContent = left >= 3600 ? `${Math.floor(left / 3600)}:${pad(Math.floor(left % 3600 / 60))}:${pad(Math.floor(left % 60))}` : `${pad(Math.floor(left / 60))}:${pad(Math.floor(left % 60))}`;
    $("#stNextAt").textContent = fmtTime(n.slot) + (n.ready ? " · kész" : "");
    $("#stCountBar").style.width = `${Math.max(0, Math.min(100, (1 - left / 3600) * 100))}%`;
  } else { $("#stCount").textContent = "--:--"; $("#stNextAt").textContent = "nincs beállítva"; }
}
setInterval(tickClock, 250);

function kindLabel(k) { return { hourly: "óránkénti", now: "azonnali", "dry-run": "próba" }[k] || k; }
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act],[data-play]"); if (!b) return;
  try {
    if (b.dataset.play) { await api("POST", "/api/control", { override: b.dataset.play }); toast("Kézi állomás beállítva"); }
    const a = b.dataset.act;
    if (a === "newsnow") startJob("/api/news/now");
    if (a === "dry") startJob("/api/news/dry-run", () => { if (S.page === "hirek") renderPage(); });
    if (a === "skipnews") { await api("POST", "/api/control", { skip_news: true }); toast("Hírblokk leállítva"); }
    if (a === "auto") { await api("POST", "/api/control", { override: "" }); toast("Vissza automatára"); }
    if (a === "nextst") {
      const r = S.status.radio || {}, list = (r.stations || []).filter((s) => s.ready);
      if (!list.length) return toast("Nincs másik szóló állomás ebben a napszakban", "err");
      const cur = r.override || r.url, i = list.findIndex((s) => s.url === cur);
      const next = list[(i + 1) % list.length];
      await api("POST", "/api/control", { override: next.url }); toast("Következő: " + next.name);
    }
  } catch (err) { toast(err.message, "err"); }
});

        <label class="f">Név<input type="text" id="fName" placeholder="pl. Telex"></label>
        <label class="f">RSS cím<input type="url" id="fUrl" placeholder="https://…/rss"></label>
        <button class="btn primary" id="fAdd">${ic("plus", "sm")}Hozzáad</button>
      </div>
    </div>
    <div class="card"><h2>Hírtörténet</h2><div class="list">${hist.entries.map((e) => `
      <details class="b"><summary><span class="dot ${e.status === "kész" || e.status === "szöveg kész" ? "ok" : e.status === "felolvasás" ? "warn" : "bad"}"></span>
        <b>${fmtDate(e.created)}</b><span class="badge">${kindLabel(e.kind)}</span><span class="muted small" style="flex:1">${esc(e.status)} · ${(e.items || []).length} hír${e.seconds ? " · " + Math.round(e.seconds) + " mp" : ""}</span>
        <span class="small mono dim">${(e.input_tokens || 0) + (e.output_tokens || 0)} tok · ${usd(e.cost_usd)}</span></summary>
        <div class="body">${e.audio ? `<audio controls preload="none" src="/api/news/audio/${encodeURIComponent(e.file)}" style="width:100%;margin-top:10px"></audio>` : ""}
          <p><i>${esc(e.intro)}</i></p>${(e.items || []).map((it) => `<p>${it.aired === false ? '<span class="badge warn">kimaradt</span> ' : ""}<b>${esc(it.source)}:</b> ${esc(it.text)} ${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener" class="small">forrás ${ic("ext", "xs")}</a>` : ""}</p>`).join("")}<p><i>${esc(e.outro)}</i></p>
          <p class="small dim">${esc(e.model || "")}: ${e.input_tokens || 0} bemeneti, ${e.output_tokens || 0} kimeneti token</p></div></details>`).join("") || '<div class="empty">Még nincs hírblokk.</div>'}</div></div>
  </div>`;
  const setHours = (arr) => { n.hours = [...new Set(arr)].sort((a, b) => a - b); markDirty(); renderPage(); };
  el.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => { const h = +b.dataset.h; hours.has(h) ? hours.delete(h) : hours.add(h); setHours([...hours]); });
  el.querySelectorAll("[data-hs]").forEach((b) => b.onclick = () => setHours(b.dataset.hs === "all" ? [...Array(24).keys()] : b.dataset.hs === "none" ? [] : Array.from({ length: 17 }, (_, i) => i + 6)));
  const num = (sel, key, int) => $(sel).oninput = (e) => { const v = int ? parseInt(e.target.value, 10) : parseFloat(e.target.value); if (!isNaN(v)) { n[key] = v; markDirty(); } };
  num("#nAge", "max_age_hours"); num("#nSec", "max_seconds"); num("#nMin", "min_items", true); num("#nMax", "max_items", true);
  $("#cModel").onchange = (e) => { c.model = e.target.value; markDirty(); };
  $("#cEffort").onchange = (e) => { c.effort = e.target.value; markDirty(); };
  $("#cFb").onchange = (e) => { c.fallback = e.target.checked; markDirty(); };
  el.querySelectorAll("[data-fdel]").forEach((b) => b.onclick = () => { n.feeds.splice(+b.dataset.fdel, 1); markDirty(); renderPage(); });
  $("#fAdd").onclick = () => {
    const name = $("#fName").value.trim(), url = $("#fUrl").value.trim();
    if (!name || !/^https?:\/\//.test(url)) return toast("Név és http(s) cím kell", "err");
    (n.feeds = n.feeds || []).push({ name, url }); markDirty(); renderPage();
  };
  $("#feedCheck").onclick = () => S.dirty ? toast("Előbb mentsd a módosításokat", "err") : startJob("/api/feeds/check");
};

/* Napszakok */
PAGES.napszakok = async (el, tk) => {
  if (!S.cfg) await loadConfig();
  if (stale(tk)) return;
  const dps = S.cfg.dayparts = S.cfg.dayparts || [];
  const cover = Array(24).fill(0);
  dps.forEach((d) => { for (let h = 0; h < 24; h++) if (d.start <= d.stop ? h >= d.start && h < d.stop : h >= d.start || h < d.stop) cover[h]++; });
  const gaps = cover.map((c, h) => c === 0 ? h : -1).filter((h) => h >= 0), dupes = cover.map((c, h) => c > 1 ? h : -1).filter((h) => h >= 0);
  const hourOpts = (v) => Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${v === h ? "selected" : ""}>${pad(h)}:00</option>`).join("");
  el.innerHTML = `
  <h1>Napszakok és műsorvezetők</h1><p class="sub">A nap felosztása: melyik időszakban milyen karakter vezeti a műsort és mondja fel a híreket, és melyik állomáslista szól.</p>
  <div class="card" style="margin-bottom:16px">${timelineHTML(dps, S.cfg.news?.hours)}
    ${gaps.length ? `<div class="note warn" style="margin-top:12px">Lefedetlen órák: ${gaps.map(pad).join(", ")} – ilyenkor a tartalék zene szól.</div>` : ""}
    ${dupes.length ? `<div class="note warn" style="margin-top:12px">Átfedő órák: ${dupes.map(pad).join(", ")} – ilyenkor az első napszak érvényes.</div>` : ""}</div>
  <div class="grid g2">${dps.map((d, i) => `
    <div class="card"><h2><span><span class="${dpColor(i)}" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px"></span>${esc(d.name)}</span>
      <button class="btn sm ghost danger" data-dpdel="${i}">${ic("x", "sm")}Törlés</button></h2>
      <div class="grid g3">
        <label class="f">Név<input type="text" data-dp="${i}" data-k="name" value="${esc(d.name)}"></label>
        <label class="f">Kezdet<select data-dp="${i}" data-k="start">${hourOpts(d.start)}</select></label>
        <label class="f">Vége<select data-dp="${i}" data-k="stop">${hourOpts(d.stop)}</select></label>
      </div>
      <label class="f" style="margin-top:12px">Műsorvezetői karakter (ezt kapja a Claude a hírblokk felvezetéséhez)
        <textarea data-dp="${i}" data-k="host" rows="3">${esc(d.host || "")}</textarea></label>
      <p class="small muted" style="margin:10px 0 0">${(d.stations || []).length} saját állomás${d.search ? `, kiegészítés: ${esc(d.search.tag || "")}${d.search.countrycode ? " / " + esc(d.search.countrycode) : ""} ×${d.search.limit}` : ""} · <a href="#allomasok" data-dptab="${i}">állomások ${ic("arrow", "xs")}</a></p>
    </div>`).join("")}
    <button class="card empty" id="dpAdd" style="cursor:pointer;min-height:140px">${ic("plus")} Új napszak</button>
  </div>`;
  el.querySelectorAll("[data-dp]").forEach((inp) => inp.oninput = inp.onchange = () => {
    const d = dps[+inp.dataset.dp], k = inp.dataset.k;
    d[k] = k === "start" || k === "stop" ? +inp.value : inp.value; markDirty();
    if (inp.tagName === "SELECT") renderPage();
  });
  el.querySelectorAll("[data-dpdel]").forEach((b) => b.onclick = () => { if (confirm("Törlöd ezt a napszakot?")) { dps.splice(+b.dataset.dpdel, 1); markDirty(); renderPage(); } });
  el.querySelectorAll("[data-dptab]").forEach((a) => a.onclick = () => { S.dpTab = +a.dataset.dptab; });
  $("#dpAdd").onclick = () => { dps.push({ name: "uj" + (dps.length + 1), start: 0, stop: 6, host: "", stations: [] }); markDirty(); renderPage(); };
};

/* Hangok */
PAGES.hangok = async (el, tk) => {
  if (!S.cfg) await loadConfig();
  S.voices = await api("GET", "/api/voices").catch(() => []);
  if (stale(tk)) return;
  const v = S.cfg.voices;
  const opts = (sel) => S.voices.map((x) => `<option value="${x.name}" ${sel === x.name ? "selected" : ""}>${x.name}${x.downloaded ? "" : " (nincs letöltve)"}</option>`).join("");
  el.innerHTML = `
  <h1>Hangok</h1><p class="sub">A Piper helyben, ingyen olvas fel. A műsorvezető a hírblokk elejét és végét, a hírolvasó a híreket mondja.</p>
  <div class="grid g2">
    <div class="card"><h2>Szereposztás</h2><div class="stack">
      <label class="f">Műsorvezető<select id="vHost">${opts(v.host)}</select></label>
      <label class="f">Hírolvasó<select id="vNews">${opts(v.news)}</select></label></div></div>
    <div class="card"><h2>Belehallgatás</h2>
      <textarea id="vText" rows="3">Jó reggelt, nyolc óra van, következnek a hírek. A Telex szerint ma napos, enyhe idő várható.</textarea>
      <p class="small muted" style="margin:8px 0 0">A hang licence hangonként eltér, a hang MODEL_CARD fájljában áll.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Elérhető magyar hangok</h2><table class="t"><tr><th>Hang</th><th>Állapot</th><th></th></tr>
    ${S.voices.map((x) => `<tr><td class="mono">${x.name}</td><td>${x.downloaded ? '<span class="badge ok">letöltve</span>' : '<span class="badge">nincs letöltve</span>'}${x.name === v.host ? ' <span class="badge">műsorvezető</span>' : ""}${x.name === v.news ? ' <span class="badge">hírolvasó</span>' : ""}</td>
      <td style="text-align:right">${x.downloaded ? `<button class="btn sm" data-vpre="${x.name}">${ic("play", "sm")}Meghallgat</button>` : `<button class="btn sm" data-vdl="${x.name}">${ic("download", "sm")}Letöltés</button>`}</td></tr>`).join("")}</table></div>`;
  $("#vHost").onchange = (e) => { v.host = e.target.value; markDirty(); };
  $("#vNews").onchange = (e) => { v.news = e.target.value; markDirty(); };
  el.querySelectorAll("[data-vdl]").forEach((b) => b.onclick = async () => {
    try { const job = await api("POST", "/api/voices/download", { names: [b.dataset.vdl] }); trackJob(job.id, () => { if (S.page === "hangok") renderPage(); }); } catch (e) { toast(e.message, "err"); }
  });
  el.querySelectorAll("[data-vpre]").forEach((b) => b.onclick = async () => {
    b.disabled = true; b.innerHTML = ic("loader", "sm spinning") + "Készül";
    try { const blob = await api("POST", "/api/voices/preview", { voice: b.dataset.vpre, text: $("#vText").value }); preview(URL.createObjectURL(blob), null); }
    catch (e) { toast(e.message, "err"); }
    b.disabled = false; b.innerHTML = ic("play", "sm") + "Meghallgat";
  });
};

/* Zenetár */
PAGES.zenetar = async (el, tk) => {
  const [backup, jingles] = await Promise.all([api("GET", "/api/library/backup").catch(() => []), api("GET", "/api/library/jingles").catch(() => [])]);
  if (stale(tk)) return;
  const total = backup.reduce((a, f) => a + f.size, 0);
  const jingle = (stem, label) => { const f = jingles.find((j) => j.name === stem + ".wav"); return `
    <div class="item"><div class="grow"><div class="name">${label}</div><div class="url">${f ? f.name + " · " + fmtBytes(f.size) : "nincs feltöltve"}</div></div>
      ${f ? `<button class="btn icon sm" data-lpv="jingles/${f.name}" aria-label="Lejátszás">${ic("play", "sm")}</button><button class="btn icon sm ghost danger" data-ldel="jingles/${f.name}" aria-label="Törlés">${ic("x", "sm")}</button>` : ""}
      <label class="btn sm">${ic("upload", "sm")}Feltöltés<input type="file" accept="audio/*" data-jup="${stem}" hidden></label></div>`; };
  el.innerHTML = `
  <h1>Zenetár</h1><p class="sub">Helyi hanganyagok: a tartalék zene akkor szól, ha egyik állomás sem elérhető; a hírszignál a hírblokk elejére és végére kerül.</p>
  <div class="grid g2">
    <div class="card"><h2><span>Tartalék zene</span><span class="small dim">${backup.length} fájl · ${fmtBytes(total)}</span></h2>
      <label class="drop" id="drop">${ic("upload", "lg")}<br>Húzd ide a zenéket, vagy kattints a tallózáshoz<br><span class="small dim">mp3, ogg, wav, flac, m4a, aac, opus</span><input type="file" id="upl" accept="audio/*" multiple hidden></label>
      <div class="list" style="margin-top:12px">${backup.map((f) => `<div class="item"><button class="btn icon sm" data-lpv="backup/${esc(f.name)}" aria-label="Lejátszás">${ic("play", "sm")}</button><div class="grow"><div class="name">${esc(f.name)}</div><div class="url">${fmtBytes(f.size)}</div></div><button class="btn icon sm ghost danger" data-ldel="backup/${esc(f.name)}" aria-label="Törlés">${ic("x", "sm")}</button></div>`).join("") || '<div class="empty">Üres: ha nincs elérhető állomás, csend lesz.</div>'}</div></div>
    <div class="card"><h2>Hírszignál</h2><div class="list">${jingle("hirek_eleje", "Hírek eleje")}${jingle("hirek_vege", "Hírek vége")}</div>
      <p class="small muted" style="margin:12px 0 0">Bármilyen hangfájl jó, WAV-ra alakítjuk. A következő hírblokktól szól.</p></div>
  </div>`;
  const upload = async (kind, file, name) => {
    toast("Feltöltés: " + file.name);
    try { await api("PUT", `/api/library/${kind}/${encodeURIComponent(name || file.name)}`, file, true); toast("Feltöltve: " + file.name, "ok"); }
    catch (e) { toast(file.name + ": " + e.message, "err"); }
  };
  const drop = $("#drop");
  const sendAll = async (files) => { for (const f of files) await upload("backup", f); renderPage(); };
  $("#upl").onchange = (e) => sendAll([...e.target.files]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); sendAll([...e.dataTransfer.files]); };
  el.querySelectorAll("[data-jup]").forEach((inp) => inp.onchange = async () => { const f = inp.files[0]; if (f) { await upload("jingles", f, inp.dataset.jup + f.name.slice(f.name.lastIndexOf("."))); renderPage(); } });
  el.querySelectorAll("[data-lpv]").forEach((b) => b.onclick = () => preview("/api/library/" + b.dataset.lpv.split("/").map(encodeURIComponent).join("/"), b));
  el.querySelectorAll("[data-ldel]").forEach((b) => b.onclick = async () => {
    if (!confirm("Törlöd: " + b.dataset.ldel.split("/")[1] + "?")) return;
    try { await api("DELETE", "/api/library/" + b.dataset.ldel.split("/").map(encodeURIComponent).join("/")); renderPage(); } catch (e) { toast(e.message, "err"); }
  });
};

/* Élő adás */
PAGES.elo = async (el, tk) => {
  const li = await api("GET", "/api/live").catch(() => null);
  if (stale(tk)) return;
  el.innerHTML = `
  <h1>Élő adás</h1><p class="sub">Bármikor átveheted az adást egy Icecast-kompatibilis küldőprogrammal (például BUTT). Bontáskor magától visszaáll az automata.</p>
  <div class="grid g2">
    <div class="card"><h2>Állapot</h2><div id="liveState"></div></div>
    <div class="card"><h2>Kapcsolódási adatok</h2>${li ? `<table class="t">
      ${[["Szervertípus", "Icecast"], ["Cím", li.host], ["Port", li.port], ["Mount", li.mount], ["Felhasználó", li.user]].map(([k, v]) => `<tr><td class="muted">${k}</td><td class="mono">${esc(v)}</td><td style="text-align:right"><button class="btn sm ghost" data-copy="${esc(v)}">${ic("copy", "sm")}Másol</button></td></tr>`).join("")}
      <tr><td class="muted">Jelszó</td><td><input type="password" id="lpw" value="${esc(li.password)}" readonly class="mono"></td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" id="lshow">${ic("eye", "sm")}Mutat</button> <button class="btn sm ghost" data-copy="${esc(li.password)}">${ic("copy", "sm")}Másol</button></td></tr></table>` : '<div class="empty">Nem elérhető</div>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Beállítás BUTT-ban</h2><ol class="muted" style="margin:0;padding-left:20px;line-height:1.9">
    <li>Settings ${ic("chev", "xs")} Main ${ic("chev", "xs")} Server ${ic("chev", "xs")} <b>Add</b></li><li>Type: <b>Icecast</b>, Address, Port, Password, Icecast mountpoint: a fenti adatok, Icecast user: <b>source</b></li>
    <li>Audio: MP3 vagy AAC, 128 kbps, 44 100 Hz, sztereó</li><li><b>Play</b> gomb: pár másodpercen belül te szólsz az adásban, a hírblokk addig kimarad.</li></ol></div>`;
  el.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Vágólapra másolva")));
  const sh = $("#lshow"); if (sh) sh.onclick = () => { const i = $("#lpw"); i.type = i.type === "password" ? "text" : "password"; sh.innerHTML = ic("eye", "sm") + (i.type === "password" ? "Mutat" : "Elrejt"); };
  renderLiveState();
};
function renderLiveState() {
  const box = $("#liveState"); if (!box || !S.status) return;
  const live = S.status.radio && S.status.radio.live && !S.status.radio.stale;
  box.innerHTML = live
    ? `<div class="row"><span class="onair live"><span class="lamp"></span>ÉLŐ ADÁS</span><span>Az élő bemenet szól az adásban.</span></div>`
    : `<div class="row"><span class="onair auto"><span class="lamp"></span>AUTOMATA</span><span class="muted">Nincs élő kapcsolat.</span></div>`;
}

/* Napló */
PAGES.naplo = (el) => {
  el.innerHTML = `
  <h1>Napló</h1><p class="sub">Mi történt a rádióban és a hírszerkesztőben.</p>
  <div class="row between" style="margin-bottom:12px">
    <div class="tabs" style="margin:0;border:0"><button data-ls="radio" class="${S.logSrc === "radio" ? "active" : ""}">Adás (Liquidsoap)</button><button data-ls="airadio" class="${S.logSrc === "airadio" ? "active" : ""}">Hírszerkesztő</button></div>
    <div class="row"><input type="text" id="lf" placeholder="Szűrés…" style="width:200px"><label class="switch"><input type="checkbox" id="la" ${S.logAuto ? "checked" : ""}> Élő</label></div>
  </div>
  <div class="log" id="log">…</div>`;
  el.querySelectorAll("[data-ls]").forEach((b) => b.onclick = () => { S.logSrc = b.dataset.ls; renderPage(); });
  $("#la").onchange = (e) => S.logAuto = e.target.checked;
  $("#lf").oninput = () => loadLog(true);
  loadLog(true);
};
let logTimer;
async function loadLog(force) {
  clearTimeout(logTimer);
  if (S.page !== "naplo") return;
  const box = $("#log"); if (!box) return;
  if (force || S.logAuto) {
    try {
      const lines = await api("GET", `/api/logs?source=${S.logSrc}&lines=600`);
      const f = ($("#lf").value || "").toLowerCase();
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      box.innerHTML = lines.filter((l) => !f || l.toLowerCase().includes(f)).map((l) => {
        const cls = /error|hiba|severe|critical|:1\]|:2\]/i.test(l) ? "e" : /warn|figyelem/i.test(l) ? "w" : /allomasok|hirek|vezerles|kész/i.test(l) ? "i" : "";
        return `<div class="${cls}">${esc(l)}</div>`;
      }).join("");
      if (atBottom || force) box.scrollTop = box.scrollHeight;
    } catch (e) { box.textContent = e.message; }
  }
  logTimer = setTimeout(() => loadLog(false), 3000);
}

/* indulás */
S.page = location.hash.slice(1) || "attekintes";
loadConfig().catch((e) => toast("A beállítás nem tölthető be: " + e.message, "err")).finally(() => renderPage());
pollStatus();
api("GET", "/api/jobs").then((jobs) => jobs.filter((j) => j.status === "fut").forEach((j) => trackJob(j.id))).catch(() => {});
</script>
