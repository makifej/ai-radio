<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>AI Rádió</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d12; --card: #12151c; --panel: #171b24; --line: #232a36; --line2: #2e3646; --text: #e7eaf0; --muted: #8e97aa;
          --dim: #5f687a; --accent: #6366f1; --style: #22d3ee; --ok: #2fd27a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); }
  body { min-height: 100vh; color: var(--text); -webkit-tap-highlight-color: transparent;
         background: radial-gradient(900px 500px at 50% -10%, rgba(99,102,241,.18), transparent), var(--bg);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .wrap { width: min(560px, 100%); margin: 0 auto; display: grid; gap: 16px;
          padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.45); min-width: 0; }
  .player { padding: 14px 20px 22px; text-align: center; }
  .viz { position: relative; width: 100%; aspect-ratio: 1; max-width: 340px; margin: 0 auto; }
  .viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36%; height: 36%; min-width: 104px; min-height: 104px; border-radius: 50%; border: 0;
          cursor: pointer; color: #fff; display: grid; place-items: center;
          background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #c084fc); box-shadow: 0 16px 60px rgba(99,102,241,.6), 0 0 0 10px rgba(99,102,241,.14); transition: transform .15s; }
  #play:active { transform: translate(-50%, -50%) scale(.96); }
  #play:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  .ic { width: 44%; height: 44%; fill: currentColor; }
  .ic.sm { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: rot .9s linear infinite; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  @keyframes rot { to { transform: rotate(360deg); } }
  h1 { margin: 4px 0 2px; font-size: 24px; letter-spacing: -.01em; }
  #state { margin: 0; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  #title { margin: 12px 0 0; min-height: 1.4em; font-weight: 650; font-size: 17px; overflow-wrap: anywhere;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #station { margin: 4px 0 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vol { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--muted); }
  #volume { flex: 1; accent-color: var(--accent); }

  /* stílusok */
  .styles { padding: 18px 16px 20px; }
  .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 12px; }
  .sh h2 { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #sst { min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { --c: #4f8cff; position: relative; overflow: hidden; min-height: 78px; padding: 12px 12px 12px 16px; text-align: left; cursor: pointer;
          border-radius: 16px; border: 1px solid var(--line2); color: var(--text); display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
          background: linear-gradient(155deg, color-mix(in srgb, var(--c) 26%, #161a23), #12151c 75%); transition: transform .08s, box-shadow .15s; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .tile:active { transform: scale(.97); }
  .tile .n { font-weight: 800; font-size: 17px; }
  .tile .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 26px color-mix(in srgb, var(--c) 35%, transparent); }
  .tile.on .s { color: var(--text); }
  .next { width: 100%; margin-top: 12px; padding: 13px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel);
          font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .find { width: 100%; margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg); font-size: 16px; }
  .find:focus { outline: none; border-color: var(--style); }
  .groups { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 4px; scrollbar-width: none; }
  .groups::-webkit-scrollbar { display: none; }
  .g { flex: none; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line2); background: none; color: var(--muted);
       font-weight: 700; font-size: 13.5px; white-space: nowrap; cursor: pointer; }
  .g.on { background: var(--text); border-color: var(--text); color: #0b0d12; }
  .g.act::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--style); vertical-align: middle; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); font-weight: 650; font-size: 14.5px; cursor: pointer; }
  .chip.on { background: var(--style); border-color: var(--style); color: #04131a; }
  .empty { color: var(--dim); font-size: 14px; padding: 6px 2px; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; max-width: calc(100vw - 32px);
           padding: 10px 16px; border-radius: 12px; background: #1d2230; border: 1px solid var(--line2); font-weight: 600; font-size: 14px;
           box-shadow: 0 12px 40px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (min-width: 420px) { .feat { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1100px) {
    .wrap { width: min(1180px, 100%); grid-template-columns: 460px minmax(0, 1fr); align-items: start; padding-top: 40px; }
    .player { position: sticky; top: 40px; }
    .viz { max-width: 420px; }
    .groups { flex-wrap: wrap; overflow: visible; margin: 12px 0 0; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="card player">
    <div class="viz">
      <canvas id="viz" aria-hidden="true"></canvas>
      <button id="play" aria-label="Lejátszás"></button>
    </div>
    <h1 id="name">AI Rádió</h1>
    <p id="state">Koppints a lejátszáshoz</p>
    <p id="title"></p>
    <p id="station"></p>
    <div class="vol" id="vol">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.3 6.5a7.6 7.6 0 0 1 0 11"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Hangerő">
    </div>
  </main>

  <section class="card styles" id="styles" hidden>
    <div class="sh"><h2>Stílus</h2><span id="sst"></span></div>
    <div class="feat" id="feat"></div>
    <button class="next" id="snext" hidden>
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5v13l9-6.5z"/><path d="M18 5.5v13"/></svg>Következő állomás
    </button>
    <input class="find" id="sfind" type="search" placeholder="Stílus keresése" aria-label="Stílus keresése" autocomplete="off">
    <div class="groups" id="groups"></div>
    <div class="chips" id="chips"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/viz.js"></script>
<script>
  const MOUNT = "/radio.mp3";
  const ICONS = {
    play: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10-6.4a.8.8 0 0 0 0-1.4l-10-6.4A.8.8 0 0 0 8 5.6z"/></svg>',
    pause: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>',
    loader: '<svg class="ic spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/></svg>',
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let toastTimer;
  function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }

  const audio = new Audio();
  audio.preload = "none";
  audio.volume = 0.8;
  // iOS-en a hangerőt a böngésző nem engedi állítani: ott a csúszka helyett a gombok kellenek.
  if (Math.abs(audio.volume - 0.8) > 0.01) $("vol").hidden = true;
  const btn = $("play"), state = $("state");
  const setBtn = (icon, label) => { btn.innerHTML = ICONS[icon]; btn.setAttribute("aria-label", label); };
  setBtn("play", "Lejátszás");
  const TOUCH = matchMedia("(pointer: coarse)").matches;
  state.textContent = TOUCH ? "Koppints a lejátszáshoz" : "Kattints a lejátszáshoz";

  const viz = window.AiradioSpectrum
    ? new AiradioSpectrum($("viz"), { mode: "radial", bars: 64, radius: 0.22, glow: 18, bloom: false })
    : null;
  if (viz) { viz.setPalette("auto"); viz.start(); }
  let actx, wanted = false, retryTimer, stallTimer;
  // Telefonon (TOUCH) nem vezetjük át a hangot a Web Audión: iOS-en lezárt képernyőnél így
  // elnémulhat. Ott a spektrum az ütemre lüktető mintát mutatja, a hang sima lejátszás.
  const nameEl = $("name");
  function mediaSession(title) {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: title || nameEl.textContent, artist: $("station").textContent || nameEl.textContent });
  }
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", () => { if (!wanted) btn.click(); });
      navigator.mediaSession.setActionHandler("pause", () => { if (wanted) btn.click(); });
      navigator.mediaSession.setActionHandler("stop", () => { if (wanted) btn.click(); });
    } catch (e) { /* nem minden böngésző ismeri mindet */ }
  }

  // Ha a kapcsolat megszakad (alagút, újraindítás), a lejátszó magától újracsatlakozik.
  function connect() {
    clearTimeout(retryTimer);
    // friss kapcsolat, hogy ne a puffer régi része szóljon
    audio.src = MOUNT + "?t=" + Date.now();
    if (viz && !actx && !TOUCH) {
      actx = new AudioContext();
      const src = actx.createMediaElementSource(audio), an = actx.createAnalyser();
      an.fftSize = 4096; an.smoothingTimeConstant = 0.55;
      src.connect(actx.destination); src.connect(an);
      viz.attach(an);
    }
    if (actx) actx.resume();
    setBtn("loader", "Kapcsolódás");
    audio.play().catch((e) => {
      if (e.name !== "NotAllowedError") return;  // hálózati hibánál az error esemény intézi
      wanted = false; state.textContent = "A lejátszás nem indult el"; setBtn("play", "Lejátszás");
    });
  }
  function reconnect() {
    if (!wanted) return;
    clearTimeout(retryTimer); clearTimeout(stallTimer);
    state.textContent = "Újrakapcsolódás"; setBtn("loader", "Kapcsolódás");
    retryTimer = setTimeout(connect, 2000);
  }

  btn.addEventListener("click", () => {
    wanted = !wanted;
    if (wanted) { connect(); return; }
    clearTimeout(retryTimer); clearTimeout(stallTimer);
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setBtn("play", "Lejátszás"); state.textContent = "Szünetel";
  });
  audio.addEventListener("playing", () => {
    clearTimeout(stallTimer); setBtn("pause", "Szünet"); state.textContent = "Élő adás";
    if (viz) viz.setActive(true);
    mediaSession($("title").textContent);
  });
  audio.addEventListener("pause", () => { if (viz) viz.setActive(false); if (!wanted) { setBtn("play", "Lejátszás"); state.textContent = "Szünetel"; } });
  audio.addEventListener("waiting", () => {
    state.textContent = "Kapcsolódás";
    clearTimeout(stallTimer); stallTimer = setTimeout(reconnect, 12000);
  });
  audio.addEventListener("error", reconnect);
  audio.addEventListener("ended", reconnect);
  $("volume").addEventListener("input", (e) => { audio.volume = e.target.value; });

  function showNow(title, station) {
    const changed = $("title").textContent !== (title || "");
    $("title").textContent = title || "";
    $("station").textContent = station || "";
    if (changed && wanted) mediaSession(title);
    if (viz) viz.setPalette(title === "Hírek" ? "news" : "auto");
  }

  // --- Stílusok (csak ha a lejátszót az airadio szolgálja ki; az Icecast saját
  // oldalán nincs API, ott csak a lejátszó látszik) ---
  const STYLE_COLORS = { rock: "#ef4444", metal: "#94a3b8", numetal: "#f97316", chill: "#22d3ee", dance: "#e879f9", joga: "#84cc16", meditacio: "#a78bfa" };
  const STYLE_STATE = { "keresés": "állomások keresése…", "kapcsolódás": "kapcsolódás…", "várakozás": "a rádióra vár…", "hiba": "nem szól", "szól": "szól" };
  const fold = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const S = { api: null, styles: null, groups: [], group: null, filter: "", active: {}, override: "", key: "" };

  async function api(method, path, body) {
    const res = await fetch(path, { method, cache: "no-store", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "Hiba"), { status: res.status });
    return data;
  }

  async function refresh() {
    if (S.api !== false) {
      try {
        const x = await api("GET", "/api/now");
        S.api = true;
        if (x.name) nameEl.textContent = x.name;
        if (!x.on_air) showNow("Az adás most nem fut", "");
        else showNow(x.title, x.station);
        S.active = x.style || {}; S.override = x.override || "";
        renderStyles();
        return;
      } catch (e) {
        if (S.api === null) S.api = false;  // Icecast-oldal: nincs API
        else return;
      }
    }
    try {
      const stats = (await (await fetch("/status-json.xsl", { cache: "no-store" })).json()).icestats;
      const src = [].concat(stats.source || []).find((s) => (s.listenurl || "").endsWith(MOUNT));
      showNow(src ? src.title || "" : "Az adás most nem fut", "");
    } catch (e) { /* a következő körben újra */ }
  }

  async function loadStyles() {
    try { const x = await api("GET", "/api/styles"); S.styles = x.styles; S.groups = x.groups; S.active = x.active || {}; }
    catch { return; }
    $("styles").hidden = false;
    renderStyles();
  }

  function stateText(a) {
    if (!a.style) return "";
    return (STYLE_STATE[a.status] || a.status) + (a.status === "szól" && a.station ? " · " + a.station.name : "");
  }

  function renderStyles() {
    if (!S.styles) return;
    const a = S.active || {};
    const activeGroup = (S.styles.find((x) => x.id === a.style) || {}).group;
    if (!S.group) S.group = store.get("airadio.player.group") || activeGroup || S.groups[0];
    const filter = fold(S.filter.trim());
    const key = JSON.stringify([a.style, a.status, a.station && a.station.url, a.error, S.override, S.group, filter]);
    if (key === S.key) return;
    S.key = key;
    const auto = !a.style && !S.override;
    $("feat").innerHTML =
      `<button class="tile ${auto ? "on" : ""}" data-auto style="--c:var(--ok)"><span class="n">Automata</span><span class="s">${auto ? "napszak szerint szól" : "napszak szerint"}</span></button>` +
      S.styles.filter((x) => x.featured).map((x) => {
        const on = a.style === x.id;
        return `<button class="tile ${on ? "on" : ""}" data-style="${esc(x.id)}" style="--c:${STYLE_COLORS[x.id] || "var(--accent)"}">
          <span class="n">${esc(x.name)}</span><span class="s">${on ? esc(stateText(a)) : "választás"}</span></button>`;
      }).join("");
    $("snext").hidden = !a.style;
    $("sst").textContent = a.style ? `${a.name}: ${stateText(a)}${a.error ? " · " + a.error : ""}` : "napszak szerinti automata";
    $("groups").innerHTML = S.groups.map((g) =>
      `<button class="g ${!filter && g === S.group ? "on" : ""} ${g === activeGroup ? "act" : ""}" data-group="${esc(g)}">${esc(g)}</button>`).join("");
    const shown = filter ? S.styles.filter((x) => fold(x.name).includes(filter)) : S.styles.filter((x) => x.group === S.group);
    $("chips").innerHTML = shown.length
      ? shown.map((x) => `<button class="chip ${a.style === x.id ? "on" : ""}" data-style="${esc(x.id)}">${esc(x.name)}</button>`).join("")
      : '<div class="empty">Nincs ilyen stílus.</div>';
  }

  document.addEventListener("click", async (e) => {
    const g = e.target.closest("[data-group]");
    if (g) {
      S.group = g.dataset.group; store.set("airadio.player.group", S.group);
      S.filter = ""; $("sfind").value = ""; S.key = ""; renderStyles(); return;
    }
    const t = e.target.closest("[data-style],[data-auto]");
    if (!t && !e.target.closest("#snext")) return;
    try {
      if (!wanted) btn.click();  // stílusválasztás után hallani is akarjuk
      if (e.target.closest("#snext")) { S.active = await api("POST", "/api/style/next"); toast("Következő állomás"); }
      else if (t.hasAttribute("data-auto")) { S.active = await api("POST", "/api/auto"); S.override = ""; toast("Vissza a napszak szerinti zenére"); }
      else {
        S.active = await api("POST", "/api/style", { style: t.dataset.style });
        toast((t.querySelector(".n") || t).textContent.trim() + " indul, pár másodperc");
      }
      S.key = ""; renderStyles();
    } catch (err) { toast(err.message || "Nem sikerült"); }
  });
  $("sfind").addEventListener("input", (e) => { S.filter = e.target.value; S.key = ""; renderStyles(); });

  loadStyles();
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
