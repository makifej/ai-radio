# Indítás:  docker compose up -d --build
# Hallgatás: http://localhost:8010, irányítópult: http://localhost:8020
# (a portok az .env fájlban átírhatók: AIRADIO_PORT, AIRADIO_ADMIN_PORT)
services:
  radio:
    build: .
    container_name: airadio
    restart: unless-stopped
    ports:
      - "${AIRADIO_PORT:-8010}:8000"
      - "${AIRADIO_LIVE_PORT:-8015}:8005"
      # Az irányítópult csak erről a gépről érhető el.
      - "127.0.0.1:${AIRADIO_ADMIN_PORT:-8020}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIRADIO_PORT: ${AIRADIO_PORT:-8010}
      AIRADIO_LIVE_PORT: ${AIRADIO_LIVE_PORT:-8015}
      AIRADIO_ADMIN_PORT: ${AIRADIO_ADMIN_PORT:-8020}
      # A Cloudflare-alagút állapotoldala: innen tudja az irányítópult a nyilvános címet.
      AIRADIO_TUNNEL_METRICS: http://tunnel:2000
      TZ: Europe/Budapest
    volumes:
      # Itt van a beállítás (config/radio.toml), a tartalék zene (backup/),
      # a letöltött hangok és a hírblokkok; a konténer újraépítése után is megmaradnak.
      - ./data:/var/lib/airadio

  # Nyilvános https-cím a hallgatói oldalhoz (telefonról, mobilnetről is), fiók nélkül:
  # Cloudflare Quick Tunnel. A cím véletlenszerű, és a konténer újraindulásakor változik;
  # az irányítópult Stúdió nézete mutatja QR-kóddal. Csak a lejátszó és az adás kerül ki,
  # az irányítópult nem. Ha nem kell: docker compose stop tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: airadio-tunnel
    restart: unless-stopped
    command: tunnel --metrics 0.0.0.0:2000 --url http://radio:8000
    depends_on:
      - radio
