<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Rádió</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #222; --text: #f2f2f2; --muted: #a1a1a6; --accent: #fb923c; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: min(420px, calc(100vw - 32px)); background: var(--card); border-radius: 20px;
         padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  #state { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  button { width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--accent);
           color: #fff; font-size: 34px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  #title { margin: 24px 0 0; min-height: 1.4em; font-weight: 600; overflow-wrap: anywhere; }
  #volume { width: 100%; margin-top: 24px; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="name">AI Rádió</h1>
  <p id="state">Kattints a lejátszáshoz</p>
  <button id="play" aria-label="Lejátszás">▶</button>
  <p id="title"></p>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Hangerő">
</main>
<script>
  const MOUNT = "/radio.mp3";
  const audio = new Audio();
  audio.preload = "none";
  audio.volume = 0.8;
  const btn = document.getElementById("play");
  const state = document.getElementById("state");

  btn.addEventListener("click", () => {
    if (audio.paused) {
      // friss kapcsolat, hogy ne a puffer régi része szóljon
      audio.src = MOUNT + "?t=" + Date.now();
      audio.play().catch(() => { state.textContent = "A lejátszás nem indult el"; });
    } else {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    }
  });
  audio.addEventListener("playing", () => { btn.textContent = "❚❚"; btn.setAttribute("aria-label", "Szünet"); state.textContent = "Élő adás"; });
  audio.addEventListener("pause", () => { btn.textContent = "▶"; btn.setAttribute("aria-label", "Lejátszás"); state.textContent = "Szünetel"; });
  audio.addEventListener("waiting", () => { state.textContent = "Kapcsolódás…"; });
  document.getElementById("volume").addEventListener("input", (e) => { audio.volume = e.target.value; });

  async function refresh() {
    try {
      const res = await fetch("/status-json.xsl", { cache: "no-store" });
      const stats = (await res.json()).icestats;
      const sources = [].concat(stats.source || []);
      const src = sources.find((s) => (s.listenurl || "").endsWith(MOUNT));
      if (!src) { document.getElementById("title").textContent = "Az adás most nem fut"; return; }
      document.getElementById("title").textContent = src.title || "";
    } catch (e) { /* a következő körben újra */ }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
