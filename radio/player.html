<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>AI Rádió</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d12; --card: #12151c; --line: #232a36; --text: #e7eaf0; --muted: #8e97aa; --accent: #6366f1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text);
         background: radial-gradient(900px 500px at 50% -10%, rgba(99,102,241,.18), transparent), var(--bg);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { width: min(520px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 24px;
         padding: 18px 24px 26px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .viz { position: relative; width: 100%; aspect-ratio: 1; max-width: 460px; margin: 0 auto; }
  .viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34%; height: 34%; min-width: 104px; min-height: 104px; border-radius: 50%; border: 0;
          cursor: pointer; color: #fff; display: grid; place-items: center;
          background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #c084fc); box-shadow: 0 16px 60px rgba(99,102,241,.6), 0 0 0 10px rgba(99,102,241,.14); transition: transform .15s; }
  #play:hover { transform: translate(-50%, -50%) scale(1.05); }
  #play:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  .ic { width: 44%; height: 44%; fill: currentColor; }
  .ic.sm { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: rot .9s linear infinite; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  @keyframes rot { to { transform: rotate(360deg); } }
  h1 { margin: 6px 0 2px; font-size: 24px; letter-spacing: -.01em; }
  #state { margin: 0; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  #title { margin: 14px 0 0; min-height: 1.4em; font-weight: 600; overflow-wrap: anywhere; }
  .vol { display: flex; align-items: center; gap: 10px; margin-top: 20px; color: var(--muted); }
  #volume { flex: 1; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="viz">
    <canvas id="viz" aria-hidden="true"></canvas>
    <button id="play" aria-label="Lejátszás"></button>
  </div>
  <h1 id="name">AI Rádió</h1>
  <p id="state">Kattints a lejátszáshoz</p>
  <p id="title"></p>
  <div class="vol">
    <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.3 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Hangerő">
  </div>
</main>
<script src="/viz.js"></script>
<script>
  const MOUNT = "/radio.mp3";
  const ICONS = {
    play: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10-6.4a.8.8 0 0 0 0-1.4l-10-6.4A.8.8 0 0 0 8 5.6z"/></svg>',
    pause: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>',
    loader: '<svg class="ic spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/></svg>',
  };
  const audio = new Audio();
  audio.preload = "none";
  audio.volume = 0.8;
  const btn = document.getElementById("play");
  const state = document.getElementById("state");
  const setBtn = (icon, label) => { btn.innerHTML = ICONS[icon]; btn.setAttribute("aria-label", label); };
  setBtn("play", "Lejátszás");

  const viz = window.AiradioSpectrum
    ? new AiradioSpectrum(document.getElementById("viz"), { mode: "radial", bars: 64, radius: 0.22, glow: 18, bloom: false })
    : null;
  if (viz) { viz.setPalette("auto"); viz.start(); }
  let actx, wanted = false, retryTimer, stallTimer;
  // Telefonon nem vezetjük át a hangot a Web Audión: iOS-en lezárt képernyőnél így
  // elnémulhat. Ott a spektrum az ütemre lüktető mintát mutatja, a hang sima lejátszás.
  const TOUCH = matchMedia("(pointer: coarse)").matches;
  const nameEl = document.getElementById("name");
  function mediaSession(title) {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: title || nameEl.textContent, artist: nameEl.textContent });
  }
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", () => { if (!wanted) btn.click(); });
      navigator.mediaSession.setActionHandler("pause", () => { if (wanted) btn.click(); });
      navigator.mediaSession.setActionHandler("stop", () => { if (wanted) btn.click(); });
    } catch (e) { /* nem minden böngésző ismeri mindet */ }
  }

  // Ha a kapcsolat megszakad (alagút, újraindítás), a lejátszó magától újracsatlakozik.
  function connect() {
    clearTimeout(retryTimer);
    // friss kapcsolat, hogy ne a puffer régi része szóljon
    audio.src = MOUNT + "?t=" + Date.now();
    if (viz && !actx && !TOUCH) {
      actx = new AudioContext();
      const src = actx.createMediaElementSource(audio), an = actx.createAnalyser();
      an.fftSize = 4096; an.smoothingTimeConstant = 0.55;
      src.connect(actx.destination); src.connect(an);
      viz.attach(an);
    }
    if (actx) actx.resume();
    setBtn("loader", "Kapcsolódás");
    audio.play().catch((e) => {
      if (e.name !== "NotAllowedError") return;  // hálózati hibánál az error esemény intézi
      wanted = false; state.textContent = "A lejátszás nem indult el"; setBtn("play", "Lejátszás");
    });
  }
  function reconnect() {
    if (!wanted) return;
    clearTimeout(retryTimer); clearTimeout(stallTimer);
    state.textContent = "Újrakapcsolódás"; setBtn("loader", "Kapcsolódás");
    retryTimer = setTimeout(connect, 2000);
  }

  btn.addEventListener("click", () => {
    wanted = !wanted;
    if (wanted) { connect(); return; }
    clearTimeout(retryTimer); clearTimeout(stallTimer);
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setBtn("play", "Lejátszás"); state.textContent = "Szünetel";
  });
  audio.addEventListener("playing", () => {
    clearTimeout(stallTimer); setBtn("pause", "Szünet"); state.textContent = "Élő adás";
    if (viz) viz.setActive(true);
    mediaSession(document.getElementById("title").textContent);
  });
  audio.addEventListener("pause", () => { if (viz) viz.setActive(false); if (!wanted) { setBtn("play", "Lejátszás"); state.textContent = "Szünetel"; } });
  audio.addEventListener("waiting", () => {
    state.textContent = "Kapcsolódás";
    clearTimeout(stallTimer); stallTimer = setTimeout(reconnect, 12000);
  });
  audio.addEventListener("error", reconnect);
  audio.addEventListener("ended", reconnect);
  document.getElementById("volume").addEventListener("input", (e) => { audio.volume = e.target.value; });

  async function refresh() {
    try {
      const res = await fetch("/status-json.xsl", { cache: "no-store" });
      const stats = (await res.json()).icestats;
      const sources = [].concat(stats.source || []);
      const src = sources.find((s) => (s.listenurl || "").endsWith(MOUNT));
      if (!src) { document.getElementById("title").textContent = "Az adás most nem fut"; return; }
      if (document.getElementById("title").textContent !== (src.title || "") && wanted) mediaSession(src.title);
      document.getElementById("title").textContent = src.title || "";
      if (viz) viz.setPalette(src.title === "Hírek" || / - Hírek$/.test(src.title || "") ? "news" : "auto");
    } catch (e) { /* a következő körben újra */ }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
